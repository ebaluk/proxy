ansible_user: root
ansible_hosts: dev_hosts
# CI sets ANSIBLE_PRIVATE_KEY_FILE; locally default to the Beget deploy key.
ansible_ssh_private_key_file: "{{ lookup('env', 'DEV_SSH_PRIVATE_KEY') | default('~/.ssh/id_beget_ebaluksf', true) }}"

deploy_src: "{{ playbook_dir }}/.."
deploy_dest: /home/appuser/proxy

compose_file: compose.yaml

rsync_excludes:
  - "--exclude=.git"
  - "--exclude=ansible"
  - "--exclude=ansible/logs"
  - "--exclude=proxy.env"
  - "--exclude=.env"
  - "--exclude=.env.local"
